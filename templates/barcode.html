      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label for="text" class="form-label">Enter your text:</label>
            <textarea class="form-control" id="text" rows="3" required></textarea>
            <div class="text-muted small mt-2">

          <div class="mb-3 d-flex flex-wrap gap-3">

                type="color"

                id="startColor"
                value="#1d4ed8"

              />
            </div>
            <div>
              <label for="endColor" class="form-label">Gradient End:</label>
              <input
                type="color"
                class="form-control form-control-color"
                id="endColor"
                value="#22d3ee"
                aria-label="Choose gradient end color"
              />

          <div class="mb-3">
            <label for="barGap" class="form-label"
              >Bar Gap: <span id="barGapValue">2</span>px</label

            <input
              type="range"

          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="cleanText" />
              <label class="form-check-label" for="cleanText">
                Remove spaces and punctuation
              </label>
            </div>
          </div>
          <div class="mb-3">
            <label for="contrast" class="form-label"
              >Contrast: <span id="contrastValue">1</span>x</label
            >
            <input
              type="range"
              class="form-control"
              id="contrast"
              min="0.5"
              max="2.5"
              step="0.1"
              value="1"
            />

          <div class="mb-3 d-flex flex-wrap gap-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="pulseMode" />

      <div class="text-center mt-4">
        <div class="container-fluid">
          <canvas id="barcodeGraph" class="img-fluid"></canvas>
        </div>

      <div class="text-center mt-3">
        <button onclick="downloadVisualization()" class="btn btn-success">
          Download Image
        </button>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Barcode Text Visualization",
        "description": "Turn text into barcode-style visualizations with gradient bars and instant downloads.",
        "url": "https://wordgrapher.com/templates/barcode.html",
        "applicationCategory": "Visualization Tool",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      const canvas = document.getElementById("barcodeGraph");
      const ctx = canvas.getContext("2d");
      let animationFrame;
      let pulseFrameId = null;
      let pulsePhase = 0;

      function cleanInputText(text) {
        return text.replace(/[^a-zA-Z0-9]/g, "");
      }

      function resizeCanvas() {
        const containerWidth = canvas.parentElement.offsetWidth;
        const width = Math.min(900, Math.max(320, containerWidth - 20));
        canvas.width = width;
        canvas.height = 320;
      }

      function hexToRgb(hex) {
        const normalized = hex.replace("#", "");
        const value =
          normalized.length === 3
            ? normalized
                .split("")
                .map((c) => c + c)
                .join("")
            : normalized;
        const intValue = parseInt(value, 16);
        return {
          r: (intValue >> 16) & 255,
          g: (intValue >> 8) & 255,
          b: intValue & 255,
        };
      }

      function lerpColor(start, end, t) {
        const startRgb = hexToRgb(start);
        const endRgb = hexToRgb(end);
        const r = Math.round(startRgb.r + (endRgb.r - startRgb.r) * t);
        const g = Math.round(startRgb.g + (endRgb.g - startRgb.g) * t);
        const b = Math.round(startRgb.b + (endRgb.b - startRgb.b) * t);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function drawBarcode(inputText) {
        const rawText = inputText;
        const text = document.getElementById("cleanText").checked
          ? cleanInputText(rawText)
          : rawText;

        resizeCanvas();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        document.getElementById("barCount").textContent = text.length;

        if (!text) return;

        const asciiValues = Array.from(text).map((char) => char.charCodeAt(0));
        const min = Math.min(...asciiValues);
        const max = Math.max(...asciiValues);
        const range = Math.max(1, max - min);

        const barGap = parseInt(document.getElementById("barGap").value, 10);
        const heightScale = parseFloat(
          document.getElementById("heightScale").value
        );
        const contrast = parseFloat(document.getElementById("contrast").value);
        const pulseMode = document.getElementById("pulseMode").checked;
        const scanlineMode = document.getElementById("scanlineMode").checked;
        const startColor = document.getElementById("startColor").value;
        const endColor = document.getElementById("endColor").value;

        const availableWidth =
          canvas.width - barGap * Math.max(0, asciiValues.length - 1);
        const barWidth = Math.max(1, Math.floor(availableWidth / asciiValues.length));

        asciiValues.forEach((value, index) => {
          const t = Math.pow((value - min) / range, contrast);
          let barHeight = Math.max(20, t * (canvas.height - 40) * heightScale);
          if (pulseMode) {
            barHeight = Math.max(
              20,
              barHeight + Math.sin(index * 0.5 + pulsePhase) * 12
            );
          }
          const x = index * (barWidth + barGap);
          const y = canvas.height - barHeight;
          ctx.fillStyle = lerpColor(startColor, endColor, t);
          ctx.fillRect(x, y, barWidth, barHeight);
        });

        ctx.strokeStyle = "rgba(15, 23, 42, 0.1)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 20);
        ctx.lineTo(canvas.width, canvas.height - 20);
        ctx.stroke();

        if (scanlineMode) {
          const lineY = ((pulsePhase * 36) % (canvas.height + 80)) - 40;
          const gradient = ctx.createLinearGradient(0, lineY - 25, 0, lineY + 25);
          gradient.addColorStop(0, "rgba(14, 165, 233, 0)");
          gradient.addColorStop(0.5, "rgba(14, 165, 233, 0.22)");
          gradient.addColorStop(1, "rgba(14, 165, 233, 0)");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, lineY - 25, canvas.width, 50);
        }
      }

      function syncPulseAnimation() {
        const pulseMode = document.getElementById("pulseMode").checked;
        const scanlineMode = document.getElementById("scanlineMode").checked;
        if ((pulseMode || scanlineMode) && !pulseFrameId) {
          const animate = () => {
            pulsePhase += 0.08;
            drawBarcode(document.getElementById("text").value);
            pulseFrameId = requestAnimationFrame(animate);
          };
          pulseFrameId = requestAnimationFrame(animate);
        }
        if (!pulseMode && !scanlineMode && pulseFrameId) {
          cancelAnimationFrame(pulseFrameId);
          pulseFrameId = null;
        }
      }

      function scheduleDraw() {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(() => {
          drawBarcode(document.getElementById("text").value);
          syncPulseAnimation();
        });
      }

      function downloadVisualization() {
        const link = document.createElement("a");
        link.download = "barcode_visualization.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      async function copyShareLink() {
        const status = document.getElementById("copyStatus");
        const text = document.getElementById("text").value;
        const url = new URL(window.location.href);
        if (text) {
          url.searchParams.set("text", text);
        } else {
          url.searchParams.delete("text");
        }
        try {
          await navigator.clipboard.writeText(url.toString());
          status.textContent = "Link copied!";
        } catch (error) {
          status.textContent = "Copy failed. Use your browser menu.";
        }
        setTimeout(() => {
          status.textContent = "";
        }, 2000);
      }

      window.addEventListener("resize", scheduleDraw);

      window.addEventListener("load", () => {
        resizeCanvas();
        const urlParams = new URLSearchParams(window.location.search);
        const text = urlParams.get("text");
        if (text) {
          document.getElementById("text").value = text;
        }
        document.getElementById("contrastValue").textContent =
          document.getElementById("contrast").value;
        scheduleDraw();
      });

      [
        "text",
        "startColor",
        "endColor",
        "barGap",
        "heightScale",
        "cleanText",
        "contrast",
        "pulseMode",
        "scanlineMode",
      ].forEach((id) => {
        const eventName =
          id === "cleanText" || id === "pulseMode" || id === "scanlineMode"
            ? "change"
            : "input";
        document.getElementById(id).addEventListener(eventName, scheduleDraw);
      });

      document.getElementById("barGap").addEventListener("input", (e) => {
        document.getElementById("barGapValue").textContent = e.target.value;
      });
      document.getElementById("heightScale").addEventListener("input", (e) => {
        document.getElementById("heightScaleValue").textContent = e.target.value;
      });
      document.getElementById("contrast").addEventListener("input", (event) => {
        document.getElementById("contrastValue").textContent = event.target.value;
      });

      function goBack(link) {
        const text = document.getElementById("text").value;
        if (text) {
          link.href = link.href + "?text=" + encodeURIComponent(text);
        }
        return true;
      }
    </script>
