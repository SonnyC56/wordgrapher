    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Constellation Text Map",
        "description": "Turn text into a glowing constellation map. Plot characters like stars, connect your word path, and download a poster-ready image instantly.",
        "url": "https://wordgrapher.com/templates/constellation.html",
        "applicationCategory": "Visualization Tool",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }

    <script>
      const canvas = document.getElementById("constellationGraph");
      const ctx = canvas.getContext("2d");
      let animationFrame;
      let twinkleFrameId = null;
      let twinklePhase = 0;

      const CHAR_SET = "abcdefghijklmnopqrstuvwxyz0123456789";
      const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

      function cleanInputText(text) {
        return text.replace(/[^a-zA-Z0-9]/g, "");
      }

      function updateCharCount(text) {
        document.getElementById("charCount").textContent = text.length;
      }

      function fnv1a32(input) {
        let hash = 0x811c9dc5;
        for (let i = 0; i < input.length; i++) {
          hash ^= input.charCodeAt(i);
          hash = Math.imul(hash, 0x01000193);
        }
        return hash >>> 0;
      }

      function mulberry32(seed) {
        let t = seed >>> 0;
        return function () {
          t += 0x6d2b79f5;
          let x = Math.imul(t ^ (t >>> 15), 1 | t);
          x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
          return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
        };
      }

      function resizeCanvas() {
        const containerWidth = canvas.parentElement.offsetWidth;
        const width = Math.min(900, Math.max(320, containerWidth - 20));
        canvas.width = width;
        canvas.height = 520;
      }

      function buildPositions() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const maxRadius = Math.min(canvas.width, canvas.height) * 0.4;
        const positions = {};

        for (let i = 0; i < CHAR_SET.length; i++) {
          const t = i / CHAR_SET.length;
          const r = Math.sqrt(t) * maxRadius;
          const theta = i * GOLDEN_ANGLE;
          positions[CHAR_SET[i]] = {
            x: centerX + Math.cos(theta) * r,
            y: centerY + Math.sin(theta) * r,
          };
        }

        return positions;
      }

      function drawBackground(text) {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#0b1220");
        gradient.addColorStop(1, "#111827");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const density = parseInt(document.getElementById("starDensity").value, 10);
        const rng = mulberry32(fnv1a32(text || "wordgrapher"));
        for (let i = 0; i < density; i++) {
          const x = rng() * canvas.width;
          const y = rng() * canvas.height;
          const r = rng() * 1.8 + 0.2;
          const alpha = rng() * 0.6 + 0.1;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
        }
      }

      function drawConstellation(inputText) {
        resizeCanvas();

        const rawText = inputText;
        updateCharCount(rawText);

        const text = document.getElementById("cleanText").checked
          ? cleanInputText(rawText)
          : rawText;

        drawBackground(text);

        if (!text) return;

        const positions = buildPositions();
        const used = new Set(
          text
            .toLowerCase()
            .split("")
            .filter((char) => CHAR_SET.includes(char))
        );

        const starColor = document.getElementById("starColor").value;
        const lineColor = document.getElementById("lineColor").value;
        const glow = parseInt(document.getElementById("glow").value, 10);
        const lineWidth = parseInt(document.getElementById("lineWidth").value, 10);
        const curve = parseFloat(document.getElementById("curve").value);
        const showLabels = document.getElementById("showLabels").checked;
        const twinkleMode = document.getElementById("twinkleMode").checked;

        // Draw connection path
        ctx.save();
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = lineColor;
        ctx.globalAlpha = 0.85;
        ctx.shadowColor = lineColor;
        ctx.shadowBlur = glow;

        const textSeed = fnv1a32(text);
        for (let i = 0; i < text.length - 1; i++) {
          const a = text[i].toLowerCase();
          const b = text[i + 1].toLowerCase();

          // Treat non-mappable characters as breaks.
          if (!positions[a] || !positions[b]) {
            continue;
          }

          const start = positions[a];
          const end = positions[b];
          const dx = end.x - start.x;
          const dy = end.y - start.y;
          const dist = Math.max(1, Math.hypot(dx, dy));

          const midX = (start.x + end.x) / 2;
          const midY = (start.y + end.y) / 2;
          const perpX = -dy / dist;
          const perpY = dx / dist;

          const sign = (fnv1a32(`${textSeed}:${i}`) & 1) === 1 ? 1 : -1;
          const strength = curve * dist;
          const ctrlX = midX + perpX * strength * sign;
          const ctrlY = midY + perpY * strength * sign;

          ctx.beginPath();
          ctx.moveTo(start.x, start.y);
          if (curve > 0) {
            ctx.quadraticCurveTo(ctrlX, ctrlY, end.x, end.y);
          } else {
            ctx.lineTo(end.x, end.y);
          }
          ctx.stroke();
        }

        ctx.restore();

        // Draw stars
        ctx.save();
        ctx.fillStyle = starColor;
        ctx.shadowColor = starColor;
        ctx.shadowBlur = Math.max(0, Math.round(glow * 0.7));

        for (const char of CHAR_SET) {
          const pos = positions[char];
          const isUsed = used.has(char);
          const radius = isUsed ? 5 : 2.5;
          const alphaBase = isUsed ? 0.95 : 0.35;
          const twinkle =
            twinkleMode && isUsed
              ? 0.2 * Math.sin(twinklePhase + pos.x * 0.03 + pos.y * 0.02)
              : 0;
          const alpha = Math.max(0.08, Math.min(1, alphaBase + twinkle));

          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
          ctx.fill();

          if (showLabels && isUsed) {
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.9;
            ctx.font = "13px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillStyle = "#e2e8f0";
            ctx.fillText(char.toUpperCase(), pos.x, pos.y + 8);
            ctx.fillStyle = starColor;
            ctx.shadowBlur = Math.max(0, Math.round(glow * 0.7));
          }
        }

        ctx.restore();

        // Caption
        ctx.save();
        ctx.fillStyle = "rgba(226, 232, 240, 0.85)";
        ctx.font = "14px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(
          `Word Grapher · Constellation Map · ${new Date().getFullYear()}`,
          14,
          canvas.height - 12
        );
        ctx.restore();
      }

      function scheduleDraw() {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(() =>
          drawConstellation(document.getElementById("text").value)
        );
      }

      function syncTwinkleAnimation() {
        const twinkleMode = document.getElementById("twinkleMode").checked;
        if (twinkleMode && !twinkleFrameId) {
          const animate = () => {
            twinklePhase += 0.08;
            drawConstellation(document.getElementById("text").value);
            twinkleFrameId = requestAnimationFrame(animate);
          };
          twinkleFrameId = requestAnimationFrame(animate);
        }
        if (!twinkleMode && twinkleFrameId) {
          cancelAnimationFrame(twinkleFrameId);
          twinkleFrameId = null;
        }
      }

      function downloadVisualization() {
        const link = document.createElement("a");
        link.download = "constellation_visualization.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      async function copyShareLink() {
        const status = document.getElementById("copyStatus");
        const text = document.getElementById("text").value;
        const url = new URL(window.location.href);
        if (text) {
          url.searchParams.set("text", text);
        } else {
          url.searchParams.delete("text");
        }
        try {
          await navigator.clipboard.writeText(url.toString());
          status.textContent = "Link copied!";
        } catch (error) {
          status.textContent = "Copy failed. Use your browser menu.";
        }
        setTimeout(() => {
          status.textContent = "";
        }, 2000);
      }

      window.addEventListener("resize", scheduleDraw);

      window.addEventListener("load", () => {
        resizeCanvas();
        const urlParams = new URLSearchParams(window.location.search);
        const text = urlParams.get("text");
        if (text) {
          document.getElementById("text").value = text;
        }
        document.getElementById("lineWidthValue").textContent =
          document.getElementById("lineWidth").value;
        scheduleDraw();
        syncTwinkleAnimation();
      });

      [
        "text",
        "lineColor",
        "starColor",
        "starDensity",
        "curve",
        "glow",
        "lineWidth",
        "showLabels",
        "twinkleMode",
        "cleanText",
      ].forEach((id) => {
        const eventName =
          id === "cleanText" || id === "showLabels" || id === "twinkleMode"
            ? "change"
            : "input";
        document.getElementById(id).addEventListener(eventName, () => {
          scheduleDraw();
          syncTwinkleAnimation();
        });
      });

      document.getElementById("starDensity").addEventListener("input", (e) => {
        document.getElementById("starDensityValue").textContent = e.target.value;
      });
      document.getElementById("curve").addEventListener("input", (e) => {
        document.getElementById("curveValue").textContent = e.target.value;
      });
      document.getElementById("glow").addEventListener("input", (e) => {
        document.getElementById("glowValue").textContent = e.target.value;
      });
      document.getElementById("lineWidth").addEventListener("input", (event) => {
        document.getElementById("lineWidthValue").textContent = event.target.value;
      });

      function goBack(link) {
        const text = document.getElementById("text").value;
        if (text) {
          link.href = link.href + "?text=" + encodeURIComponent(text);
        }
        return true;
      }
    </script>
