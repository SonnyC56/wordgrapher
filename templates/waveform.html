      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label for="text" class="form-label">Enter your text:</label>
            <textarea class="form-control" id="text" rows="3" required></textarea>
            <div class="text-muted small mt-2">

            <div>

              <input
                type="color"
                class="form-control form-control-color"

          <div class="mb-3 d-flex flex-wrap gap-3">

              <input class="form-check-input" type="checkbox" id="mirror" checked />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Text Waveform",
        "description": "Render text as an audio-style waveform. Map characters to amplitude, add glow and fill, and download a high-contrast image instantly.",
        "url": "https://wordgrapher.com/templates/waveform.html",
        "applicationCategory": "Visualization Tool",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      const canvas = document.getElementById("waveformGraph");
      const ctx = canvas.getContext("2d");
      let animationFrame;
      let jitterFrameId = null;
      let jitterPhase = 0;

      function cleanInputText(text) {
        return text.replace(/[^a-zA-Z0-9]/g, "");
      }

      function updateCharCount(text) {
        document.getElementById("charCount").textContent = text.length;
      }

      function resizeCanvas() {
        const containerWidth = canvas.parentElement.offsetWidth;
        const width = Math.min(900, Math.max(320, containerWidth - 20));
        canvas.width = width;
        canvas.height = 420;
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#0b1220");
        gradient.addColorStop(1, "#111827");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle grid
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.strokeStyle = "#94a3b8";
        ctx.lineWidth = 1;
        const step = 40;
        for (let x = 0; x <= canvas.width; x += step) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += step) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function buildPoints(asciiValues, padding, amplitudeScale) {
        const min = Math.min(...asciiValues);
        const max = Math.max(...asciiValues);
        const range = Math.max(1, max - min);

        const usableWidth = canvas.width - padding * 2;
        const step = asciiValues.length > 1 ? usableWidth / (asciiValues.length - 1) : 0;
        const centerY = canvas.height / 2;
        const maxAmp = (canvas.height / 2 - padding) * amplitudeScale;

        const top = [];
        const bottom = [];

        asciiValues.forEach((value, index) => {
          const t = (value - min) / range;
          const amp = (t - 0.5) * 2 * maxAmp;
          const x = padding + index * step;
          top.push({ x, y: centerY - amp });
          bottom.push({ x, y: centerY + amp });
        });

        return { top, bottom, centerY };
      }

      function drawSmoothLine(points) {
        if (points.length === 0) return;
        if (points.length === 1) {
          ctx.beginPath();
          ctx.arc(points[0].x, points[0].y, 2, 0, Math.PI * 2);
          ctx.fill();
          return;
        }

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < points.length - 1; i++) {
          const midX = (points[i].x + points[i + 1].x) / 2;
          const midY = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, midX, midY);
        }

        const last = points[points.length - 1];
        ctx.lineTo(last.x, last.y);
      }

      function drawWaveform(inputText) {
        resizeCanvas();
        drawBackground();

        const rawText = inputText;
        updateCharCount(rawText);

        const text = document.getElementById("cleanText").checked
          ? cleanInputText(rawText)
          : rawText;

        if (!text) return;

        const asciiValues = Array.from(text).map((char) => char.charCodeAt(0));

        const amplitudeScale = parseFloat(document.getElementById("amplitude").value);
        const strokeWidth = parseInt(document.getElementById("strokeWidth").value, 10);
        const glow = parseInt(document.getElementById("glow").value, 10);
        const lineColor = document.getElementById("lineColor").value;
        const fillColor = document.getElementById("fillColor").value;
        const mirror = document.getElementById("mirror").checked;
        const fill = document.getElementById("fill").checked;
        const rainbowMode = document.getElementById("rainbowMode").checked;
        const jitterMode = document.getElementById("jitterMode").checked;

        const padding = 32;
        const points = buildPoints(asciiValues, padding, amplitudeScale);
        if (jitterMode) {
          points.top = points.top.map((point, index) => ({
            x: point.x,
            y: point.y + Math.sin(index * 0.5 + jitterPhase) * 4,
          }));
          points.bottom = points.bottom.map((point, index) => ({
            x: point.x,
            y: point.y - Math.sin(index * 0.5 + jitterPhase) * 4,
          }));
        }

        // Center line
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = "rgba(226, 232, 240, 0.25)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding, points.centerY);
        ctx.lineTo(canvas.width - padding, points.centerY);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.lineWidth = strokeWidth;
        const rainbowGradient = ctx.createLinearGradient(
          padding + Math.sin(jitterPhase) * 40,
          0,
          canvas.width - padding + Math.sin(jitterPhase) * 40,
          0
        );
        rainbowGradient.addColorStop(0, "hsl(8, 92%, 56%)");
        rainbowGradient.addColorStop(0.25, "hsl(48, 92%, 56%)");
        rainbowGradient.addColorStop(0.5, "hsl(160, 92%, 50%)");
        rainbowGradient.addColorStop(0.75, "hsl(210, 92%, 56%)");
        rainbowGradient.addColorStop(1, "hsl(302, 88%, 60%)");
        ctx.strokeStyle = rainbowMode ? rainbowGradient : lineColor;
        ctx.shadowColor = rainbowMode ? "rgba(255, 255, 255, 0.8)" : lineColor;
        ctx.shadowBlur = glow;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        if (fill && mirror) {
          ctx.save();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 0.22;
          ctx.fillStyle = rainbowMode ? "rgba(59, 130, 246, 0.22)" : fillColor;

          drawSmoothLine(points.top);
          const lastBottom = points.bottom[points.bottom.length - 1];
          ctx.lineTo(lastBottom.x, lastBottom.y);
          drawSmoothLine(points.bottom.slice().reverse());
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        ctx.globalAlpha = 0.95;
        drawSmoothLine(points.top);
        ctx.stroke();

        if (mirror) {
          ctx.globalAlpha = 0.85;
          drawSmoothLine(points.bottom);
          ctx.stroke();
        }

        ctx.restore();

        // Caption
        ctx.save();
        ctx.fillStyle = "rgba(226, 232, 240, 0.85)";
        ctx.font = "14px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText(
          `Word Grapher · Waveform · ${new Date().getFullYear()}`,
          14,
          canvas.height - 12
        );
        ctx.restore();
      }

      function scheduleDraw() {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(() => {
          drawWaveform(document.getElementById("text").value);
          syncJitterAnimation();
        });
      }

      function syncJitterAnimation() {
        const jitterMode = document.getElementById("jitterMode").checked;
        const rainbowMode = document.getElementById("rainbowMode").checked;
        if ((jitterMode || rainbowMode) && !jitterFrameId) {
          const animate = () => {
            jitterPhase += 0.1;
            drawWaveform(document.getElementById("text").value);
            jitterFrameId = requestAnimationFrame(animate);
          };
          jitterFrameId = requestAnimationFrame(animate);
        }
        if (!jitterMode && !rainbowMode && jitterFrameId) {
          cancelAnimationFrame(jitterFrameId);
          jitterFrameId = null;
        }
      }

      function downloadVisualization() {
        const link = document.createElement("a");
        link.download = "waveform_visualization.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      async function copyShareLink() {
        const status = document.getElementById("copyStatus");
        const text = document.getElementById("text").value;
        const url = new URL(window.location.href);
        if (text) {
          url.searchParams.set("text", text);
        } else {
          url.searchParams.delete("text");
        }
        try {
          await navigator.clipboard.writeText(url.toString());
          status.textContent = "Link copied!";
        } catch (error) {
          status.textContent = "Copy failed. Use your browser menu.";
        }
        setTimeout(() => {
          status.textContent = "";
        }, 2000);
      }

      window.addEventListener("resize", scheduleDraw);

      window.addEventListener("load", () => {
        resizeCanvas();
        const urlParams = new URLSearchParams(window.location.search);
        const text = urlParams.get("text");
        if (text) {
          document.getElementById("text").value = text;
        }
        scheduleDraw();
      });

      [
        "text",
        "lineColor",
        "fillColor",
        "amplitude",
        "strokeWidth",
        "glow",
        "mirror",
        "fill",
        "rainbowMode",
        "jitterMode",
        "cleanText",
      ].forEach((id) => {
        const eventName =
          id === "cleanText" ||
          id === "mirror" ||
          id === "fill" ||
          id === "rainbowMode" ||
          id === "jitterMode"
            ? "change"
            : "input";
        document.getElementById(id).addEventListener(eventName, scheduleDraw);
      });

      document.getElementById("amplitude").addEventListener("input", (e) => {
        document.getElementById("amplitudeValue").textContent = e.target.value;
      });
      document.getElementById("strokeWidth").addEventListener("input", (e) => {
        document.getElementById("strokeWidthValue").textContent = e.target.value;
      });
      document.getElementById("glow").addEventListener("input", (e) => {
        document.getElementById("glowValue").textContent = e.target.value;
      });

      function goBack(link) {
        const text = document.getElementById("text").value;
        if (text) {
          link.href = link.href + "?text=" + encodeURIComponent(text);
        }
        return true;
      }
    </script>
