      <div class="card">

          <div class="mb-3">

      <div class="text-center mt-4">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Circular Word Visualization",
        "description": "Create beautiful circular visualizations from text using golden ratio spirals.",
        "url": "https://wordgrapher.com/templates/circular.html",
        "applicationCategory": "Visualization Tool",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      const canvas = document.getElementById("circularGraph");
      const ctx = canvas.getContext("2d");
      const blackCanvas = document.getElementById("blackGraph");
      const blackCtx = blackCanvas.getContext("2d");
      let animationFrame;

      function cleanInputText(text) {
        return text.replace(/[^a-zA-Z0-9]/g, "");
      }

      function resizeCanvases() {
        const containerWidth = canvas.parentElement.offsetWidth;
        const size = Math.min(600, Math.max(280, containerWidth - 20));
        canvas.width = size;
        canvas.height = size;
        blackCanvas.width = size;
        blackCanvas.height = size;
      }

      function getPositions(radius, centerX, centerY) {
        const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
        const positions = {};
        alphabet.forEach((char, index) => {
          const angle = -Math.PI / 2 + (index / alphabet.length) * Math.PI * 2;
          positions[char] = {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle),
          };
        });
        return positions;
      }

      function drawCircularVisualization(inputText) {
        const text = document.getElementById("cleanText").checked
          ? cleanInputText(inputText)
          : inputText;
        const radius = Math.min(canvas.width, canvas.height) * 0.38;
        const nodeRadius = Math.max(10, Math.round(radius * 0.08));
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!text) return;

        const positions = getPositions(radius, centerX, centerY);

        ctx.font = "16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        Object.entries(positions).forEach(([char, pos]) => {
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, nodeRadius, 0, Math.PI * 2);

          if (text.toLowerCase().includes(char)) {
            ctx.fillStyle = "#e3f2fd";
            ctx.strokeStyle = "#2196f3";
          } else {
            ctx.fillStyle = "#f5f5f5";
            ctx.strokeStyle = "#e0e0e0";
          }

          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = text.toLowerCase().includes(char) ? "#000" : "#757575";
          ctx.fillText(char, pos.x, pos.y);
        });

        const lineColor = document.getElementById("colorPicker").value;
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2;

        const phi = (1 + Math.sqrt(5)) / 2;
        const angleIncrement = Math.PI * 2 * (1 - 1 / phi);

        for (let i = 0; i < text.length - 1; i++) {
          const char1 = text[i].toLowerCase();
          const char2 = text[i + 1].toLowerCase();

          if (positions[char1] && positions[char2]) {
            const start = positions[char1];
            const end = positions[char2];

            const angle = angleIncrement * i;
            const spiralRadius = radius * (1 - i / (text.length * 2));

            const ctrl1X = centerX + Math.cos(angle) * spiralRadius;
            const ctrl1Y = centerY + Math.sin(angle) * spiralRadius;
            const ctrl2X =
              centerX + Math.cos(angle + angleIncrement) * spiralRadius;
            const ctrl2Y =
              centerY + Math.sin(angle + angleIncrement) * spiralRadius;

            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.bezierCurveTo(ctrl1X, ctrl1Y, ctrl2X, ctrl2Y, end.x, end.y);
            ctx.stroke();

            ctx.save();
            ctx.shadowColor = lineColor;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = lineColor;
            ctx.globalAlpha = 0.3;
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      function drawBlackVisualization(inputText) {
        const text = document.getElementById("cleanText").checked
          ? cleanInputText(inputText)
          : inputText;
        const radius = Math.min(blackCanvas.width, blackCanvas.height) * 0.38;
        const nodeRadius = Math.max(10, Math.round(radius * 0.08));
        const centerX = blackCanvas.width / 2;
        const centerY = blackCanvas.height / 2;

        blackCtx.clearRect(0, 0, blackCanvas.width, blackCanvas.height);
        if (!text) return;

        const positions = getPositions(radius, centerX, centerY);

        Object.entries(positions).forEach(([char, pos]) => {
          blackCtx.beginPath();
          blackCtx.arc(pos.x, pos.y, nodeRadius, 0, Math.PI * 2);
          blackCtx.fillStyle = "#000";
          blackCtx.fill();
        });

        const phi = (1 + Math.sqrt(5)) / 2;
        const angleIncrement = Math.PI * 2 * (1 - 1 / phi);

        blackCtx.strokeStyle = "#000";
        blackCtx.lineWidth = 2;

        for (let i = 0; i < text.length - 1; i++) {
          const char1 = text[i].toLowerCase();
          const char2 = text[i + 1].toLowerCase();

          if (positions[char1] && positions[char2]) {
            const start = positions[char1];
            const end = positions[char2];

            const angle = angleIncrement * i;
            const spiralRadius = radius * (1 - i / (text.length * 2));

            const ctrl1X = centerX + Math.cos(angle) * spiralRadius;
            const ctrl1Y = centerY + Math.sin(angle) * spiralRadius;
            const ctrl2X =
              centerX + Math.cos(angle + angleIncrement) * spiralRadius;
            const ctrl2Y =
              centerY + Math.sin(angle + angleIncrement) * spiralRadius;

            blackCtx.beginPath();
            blackCtx.moveTo(start.x, start.y);
            blackCtx.bezierCurveTo(ctrl1X, ctrl1Y, ctrl2X, ctrl2Y, end.x, end.y);
            blackCtx.stroke();
          }
        }
      }

      function drawBoth() {
        const text = document.getElementById("text").value;
        drawCircularVisualization(text);
        drawBlackVisualization(text);
      }

      function scheduleDraw() {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(drawBoth);
      }

      function downloadVisualization() {
        const link = document.createElement("a");
        link.download = "circular_visualization.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      function downloadBlackVisualization() {
        const link = document.createElement("a");
        link.download = "circular_visualization_black.png";
        link.href = blackCanvas.toDataURL("image/png");
        link.click();
      }

      async function copyShareLink() {
        const status = document.getElementById("copyStatus");
        const text = document.getElementById("text").value;
        const url = new URL(window.location.href);
        if (text) {
          url.searchParams.set("text", text);
        } else {
          url.searchParams.delete("text");
        }
        try {
          await navigator.clipboard.writeText(url.toString());
          status.textContent = "Link copied!";
        } catch (error) {
          status.textContent = "Copy failed. Use your browser menu.";
        }
        setTimeout(() => {
          status.textContent = "";
        }, 2000);
      }

      window.addEventListener("resize", () => {
        resizeCanvases();
        scheduleDraw();
      });

      // Load text from URL params if present
      window.addEventListener("load", () => {
        resizeCanvases();
        const urlParams = new URLSearchParams(window.location.search);
        const text = urlParams.get("text");
        if (text) {
          document.getElementById("text").value = text;
        }
        drawBoth();
      });

      ["text", "colorPicker", "cleanText"].forEach((id) => {
        const eventName = id === "cleanText" ? "change" : "input";
        document.getElementById(id).addEventListener(eventName, scheduleDraw);
      });

      function goBack(link) {
        const text = document.getElementById("text").value;
        if (text) {
          link.href = link.href + "?text=" + encodeURIComponent(text);
        }
        return true;
      }
    </script>
