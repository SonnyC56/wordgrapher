  <body>
    <div class="main-content">
      <div class="text-center mb-4">

      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label for="text" class="form-label">Enter your text:</label>
            <textarea class="form-control" id="text" rows="3" required></textarea>
          </div>
          <div class="mb-3 d-flex flex-wrap gap-3">
            <div>
              <label for="startColor" class="form-label">Gradient Start:</label>
              <input
                type="color"
                class="form-control form-control-color"
                id="startColor"
                value="#f97316"
                aria-label="Choose gradient start color"
              />
            </div>
            <div>
              <label for="endColor" class="form-label">Gradient End:</label>
              <input
                type="color"
                class="form-control form-control-color"
                id="endColor"
                value="#0ea5e9"
                aria-label="Choose gradient end color"
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="columns" class="form-label"
              >Columns: <span id="columnsValue">16</span></label
            >
            <input
              type="range"
              class="form-control"
              id="columns"
              min="6"
              max="30"
              step="1"
              value="16"
            />
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="showGlyphs"
                checked
              />
              <label class="form-check-label" for="showGlyphs">
                Show letters on tiles
              </label>
            </div>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="cleanText" />
              <label class="form-check-label" for="cleanText">
                Remove spaces and punctuation
              </label>
            </div>
          </div>
        </div>

      <div class="text-center mt-4">
        <div class="container-fluid">
          <canvas id="heatmapGraph" class="img-fluid"></canvas>
        </div>
      </div>

      <div class="text-center mt-3">
        <button onclick="downloadVisualization()" class="btn btn-success">
          Download Image
        </button>
        <button onclick="copyShareLink()" class="btn btn-outline-secondary">
          Copy Share Link
        </button>
        <span id="copyStatus" class="text-muted ms-2"></span>
      </div>
    </div>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Text Heatmap Grid",
        "description": "Visualize text as a heatmap grid with optional glyph overlays and instant downloads.",
        "url": "https://wordgrapher.com/templates/heatmap.html",
        "applicationCategory": "Visualization Tool",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      const canvas = document.getElementById("heatmapGraph");
      const ctx = canvas.getContext("2d");
      let animationFrame;

      function cleanInputText(text) {
        return text.replace(/[^a-zA-Z0-9]/g, "");
      }

      function resizeCanvas() {
        const containerWidth = canvas.parentElement.offsetWidth;
        const width = Math.min(900, Math.max(320, containerWidth - 20));
        canvas.width = width;
      }

      function hexToRgb(hex) {
        const normalized = hex.replace("#", "");
        const value =
          normalized.length === 3
            ? normalized
                .split("")
                .map((c) => c + c)
                .join("")
            : normalized;
        const intValue = parseInt(value, 16);
        return {
          r: (intValue >> 16) & 255,
          g: (intValue >> 8) & 255,
          b: intValue & 255,
        };
      }

      function lerpColor(start, end, t) {
        const startRgb = hexToRgb(start);
        const endRgb = hexToRgb(end);
        const r = Math.round(startRgb.r + (endRgb.r - startRgb.r) * t);
        const g = Math.round(startRgb.g + (endRgb.g - startRgb.g) * t);
        const b = Math.round(startRgb.b + (endRgb.b - startRgb.b) * t);
        return { r, g, b };
      }

      function getContrastColor(rgb) {
        const luminance = 0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b;
        return luminance > 140 ? "#0f172a" : "#f8fafc";
      }

      function drawHeatmap(inputText) {
        const rawText = inputText;
        const text = document.getElementById("cleanText").checked
          ? cleanInputText(rawText)
          : rawText;

        resizeCanvas();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!text) return;

        const asciiValues = Array.from(text).map((char) => char.charCodeAt(0));
        const min = Math.min(...asciiValues);
        const max = Math.max(...asciiValues);
        const range = Math.max(1, max - min);

        const columns = parseInt(document.getElementById("columns").value, 10);
        const cellSize = Math.max(12, Math.floor(canvas.width / columns));
        const rows = Math.ceil(asciiValues.length / columns);
        canvas.height = Math.max(240, rows * cellSize);

        const startColor = document.getElementById("startColor").value;
        const endColor = document.getElementById("endColor").value;
        const showGlyphs = document.getElementById("showGlyphs").checked;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        asciiValues.forEach((value, index) => {
          const t = (value - min) / range;
          const rgb = lerpColor(startColor, endColor, t);
          const row = Math.floor(index / columns);
          const col = index % columns;
          const x = col * cellSize;
          const y = row * cellSize;

          ctx.fillStyle = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
          ctx.fillRect(x, y, cellSize, cellSize);

          if (showGlyphs) {
            ctx.fillStyle = getContrastColor(rgb);
            ctx.font = `${Math.max(10, Math.floor(cellSize * 0.45))}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text[index], x + cellSize / 2, y + cellSize / 2);
          }
        });
      }

      function scheduleDraw() {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(() =>
          drawHeatmap(document.getElementById("text").value)
        );
      }

      function downloadVisualization() {
        const link = document.createElement("a");
        link.download = "heatmap_visualization.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      async function copyShareLink() {
        const status = document.getElementById("copyStatus");
        const text = document.getElementById("text").value;
        const url = new URL(window.location.href);
        if (text) {
          url.searchParams.set("text", text);
        } else {
          url.searchParams.delete("text");
        }
        try {
          await navigator.clipboard.writeText(url.toString());
          status.textContent = "Link copied!";
        } catch (error) {
          status.textContent = "Copy failed. Use your browser menu.";
        }
        setTimeout(() => {
          status.textContent = "";
        }, 2000);
      }

      window.addEventListener("resize", scheduleDraw);

      window.addEventListener("load", () => {
        resizeCanvas();
        const urlParams = new URLSearchParams(window.location.search);
        const text = urlParams.get("text");
        if (text) {
          document.getElementById("text").value = text;
        }
        scheduleDraw();
      });

      [
        "text",
        "startColor",
        "endColor",
        "columns",
        "showGlyphs",
        "cleanText",
      ].forEach((id) => {
        const eventName = id === "cleanText" || id === "showGlyphs" ? "change" : "input";
        document.getElementById(id).addEventListener(eventName, scheduleDraw);
      });

      document.getElementById("columns").addEventListener("input", (e) => {
        document.getElementById("columnsValue").textContent = e.target.value;
      });

      function goBack(link) {
        const text = document.getElementById("text").value;
        if (text) {
          link.href = link.href + "?text=" + encodeURIComponent(text);
        }
        return true;
      }
    </script>
