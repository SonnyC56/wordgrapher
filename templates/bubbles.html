  <body>
    <div class="main-content">

      <div class="card">
        <div class="card-body">
          <div class="mb-3">
            <label for="text" class="form-label">Enter your text:</label>
            <textarea class="form-control" id="text" rows="3" required></textarea>
            <div class="text-muted small mt-2">
              Characters: <span id="charCount">0</span>
            </div>
          </div>
          <div class="mb-3 d-flex flex-wrap gap-3">
            <div>
              <label for="startColor" class="form-label">Palette Start:</label>
              <input
                type="color"
                class="form-control form-control-color"
                id="startColor"
                value="#f97316"
                aria-label="Choose start color"
              />
            </div>
            <div>
              <label for="endColor" class="form-label">Palette End:</label>
              <input
                type="color"
                class="form-control form-control-color"
                id="endColor"
                value="#0ea5e9"
                aria-label="Choose end color"
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="maxBubbles" class="form-label"
              >Max Bubbles: <span id="maxBubblesValue">18</span></label
            >
            <input
              type="range"
              class="form-control"

            <label for="bubblePadding" class="form-label"
              >Bubble Padding: <span id="bubblePaddingValue">6</span>px</label
            >
            <input
              type="range"

              min="0"
              max="20"
              step="1"
              value="6"
            />
          </div>
          <div class="mb-3 d-flex flex-wrap gap-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="showCounts" checked />
              <label class="form-check-label" for="showCounts">Show counts</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="wobbleMode" />
              <label class="form-check-label" for="wobbleMode">
                Wobble Animation
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="glassMode" />
              <label class="form-check-label" for="glassMode">Glass Shine</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="ignoreCase" checked />
              <label class="form-check-label" for="ignoreCase">Ignore case</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="cleanText" />
              <label class="form-check-label" for="cleanText">
                Remove spaces and punctuation

      <div class="text-center mt-4">
        <div class="container-fluid">
          <canvas id="bubbleGraph" class="img-fluid"></canvas>
        </div>
      </div>

      <div class="text-center mt-3">
        <button onclick="downloadVisualization()" class="btn btn-success">
          Download Image
        </button>

          Copy Share Link

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Text Bubble Frequency Map",
        "description": "Visualize character frequency as packed bubbles where size maps to count.",
        "url": "https://wordgrapher.com/templates/bubbles.html",
        "applicationCategory": "Visualization Tool",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      const canvas = document.getElementById("bubbleGraph");
      const ctx = canvas.getContext("2d");
      let animationFrame;
      let wobbleFrameId = null;
      let wobblePhase = 0;

      function cleanInputText(text) {
        return text.replace(/[^a-zA-Z0-9]/g, "");
      }

      function updateCharCount(text) {
        document.getElementById("charCount").textContent = text.length;
      }

      function resizeCanvas() {
        const containerWidth = canvas.parentElement.offsetWidth;
        const width = Math.min(900, Math.max(320, containerWidth - 20));
        canvas.width = width;
        canvas.height = 560;
      }

      function hexToRgb(hex) {
        const value = hex.replace("#", "");
        const full =
          value.length === 3
            ? value
                .split("")
                .map((char) => char + char)
                .join("")
            : value;
        const intValue = parseInt(full, 16);
        return {
          r: (intValue >> 16) & 255,
          g: (intValue >> 8) & 255,
          b: intValue & 255,
        };
      }

      function lerpColor(startHex, endHex, t) {
        const start = hexToRgb(startHex);
        const end = hexToRgb(endHex);
        const r = Math.round(start.r + (end.r - start.r) * t);
        const g = Math.round(start.g + (end.g - start.g) * t);
        const b = Math.round(start.b + (end.b - start.b) * t);
        return { r, g, b };
      }

      function contrastColor(color) {
        const luminance =
          0.2126 * color.r + 0.7152 * color.g + 0.0722 * color.b;
        return luminance > 150 ? "#0f172a" : "#f8fafc";
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#fff7ed");
        gradient.addColorStop(1, "#eff6ff");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function buildFrequency(text) {
        let processed = text;
        if (document.getElementById("cleanText").checked) {
          processed = cleanInputText(processed);
        }
        if (document.getElementById("ignoreCase").checked) {
          processed = processed.toLowerCase();
        }

        const chars = Array.from(processed).filter((char) => /\S/.test(char));
        const counts = new Map();

        for (const char of chars) {
          counts.set(char, (counts.get(char) || 0) + 1);
        }

        const maxBubbles = parseInt(
          document.getElementById("maxBubbles").value,
          10
        );
        return [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])))
          .slice(0, maxBubbles)
          .map(([char, count]) => ({ char, count }));
      }

      function placeBubbles(items) {
        if (items.length === 0) {
          return [];
        }

        const maxCount = Math.max(1, ...items.map((item) => item.count));
        const padding = parseInt(document.getElementById("bubblePadding").value, 10);
        const minRadius = 24;
        const maxRadius = Math.min(canvas.width, canvas.height) * 0.15;

        const withRadius = items.map((item) => ({
          ...item,
          radius:
            minRadius +
            Math.sqrt(item.count / maxCount) * (maxRadius - minRadius),
        }));

        const placed = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        for (const bubble of withRadius) {
          let found = null;

          // Spiral search for non-overlapping placement.
          for (let step = 0; step < 1800; step++) {
            const angle = step * 0.32;
            const distance = step * 0.45;
            const x = centerX + Math.cos(angle) * distance;
            const y = centerY + Math.sin(angle) * distance;

            if (
              x - bubble.radius < 8 ||
              x + bubble.radius > canvas.width - 8 ||
              y - bubble.radius < 8 ||
              y + bubble.radius > canvas.height - 8
            ) {
              continue;
            }

            let collides = false;
            for (const existing of placed) {
              const dx = x - existing.x;
              const dy = y - existing.y;
              const minDistance = bubble.radius + existing.radius + padding;
              if (dx * dx + dy * dy < minDistance * minDistance) {
                collides = true;
                break;
              }
            }

            if (!collides) {
              found = { ...bubble, x, y };
              break;
            }
          }

          if (!found) {
            found = { ...bubble, x: centerX, y: centerY };
          }
          placed.push(found);
        }

        return placed;
      }

      function drawBubbles(inputText) {
        resizeCanvas();
        drawBackground();

        updateCharCount(inputText);
        const items = buildFrequency(inputText);

        if (items.length === 0) {
          return;
        }

        const startColor = document.getElementById("startColor").value;
        const endColor = document.getElementById("endColor").value;
        const showCounts = document.getElementById("showCounts").checked;
        const wobbleMode = document.getElementById("wobbleMode").checked;
        const glassMode = document.getElementById("glassMode").checked;

        const bubbles = placeBubbles(items);
        const max = Math.max(1, bubbles.length - 1);

        bubbles.forEach((bubble, index) => {
          const t = index / max;
          const rgb = lerpColor(startColor, endColor, t);
          const fill = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.86)`;
          const stroke = `rgba(${Math.max(0, rgb.r - 30)}, ${Math.max(
            0,
            rgb.g - 30
          )}, ${Math.max(0, rgb.b - 30)}, 0.95)`;
          const textColor = contrastColor(rgb);
          const wobbleX = wobbleMode
            ? Math.cos(wobblePhase + index * 0.7) * 2.5
            : 0;
          const wobbleY = wobbleMode
            ? Math.sin(wobblePhase + index * 0.7) * 2.5
            : 0;
          const drawX = bubble.x + wobbleX;
          const drawY = bubble.y + wobbleY;

          ctx.beginPath();
          ctx.arc(drawX, drawY, bubble.radius, 0, Math.PI * 2);
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = stroke;
          ctx.stroke();

          if (glassMode) {
            ctx.beginPath();
            ctx.arc(
              drawX - bubble.radius * 0.2,
              drawY - bubble.radius * 0.25,
              bubble.radius * 0.35,
              0,
              Math.PI * 2
            );
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            ctx.fill();
          }

          ctx.fillStyle = textColor;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const charFontSize = Math.max(12, Math.floor(bubble.radius * 0.48));
          ctx.font = `600 ${charFontSize}px Arial`;
          ctx.fillText(String(bubble.char).toUpperCase(), drawX, drawY - 5);

          if (showCounts) {
            const countFontSize = Math.max(10, Math.floor(bubble.radius * 0.22));
            ctx.font = `${countFontSize}px Arial`;
            ctx.fillText(`${bubble.count}`, drawX, drawY + charFontSize * 0.45);
          }
        });

        ctx.fillStyle = "rgba(15, 23, 42, 0.65)";
        ctx.font = "13px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.fillText("Word Grapher · Bubble Frequency", 12, canvas.height - 10);
      }

      function scheduleDraw() {
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(() => {
          drawBubbles(document.getElementById("text").value);
          syncWobbleAnimation();
        });
      }

      function syncWobbleAnimation() {
        const wobbleMode = document.getElementById("wobbleMode").checked;
        if (wobbleMode && !wobbleFrameId) {
          const animate = () => {
            wobblePhase += 0.08;
            drawBubbles(document.getElementById("text").value);
            wobbleFrameId = requestAnimationFrame(animate);
          };
          wobbleFrameId = requestAnimationFrame(animate);
        }
        if (!wobbleMode && wobbleFrameId) {
          cancelAnimationFrame(wobbleFrameId);
          wobbleFrameId = null;
        }
      }

      function downloadVisualization() {
        const link = document.createElement("a");
        link.download = "bubble_frequency_visualization.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      async function copyShareLink() {
        const status = document.getElementById("copyStatus");
        const text = document.getElementById("text").value;
        const url = new URL(window.location.href);
        if (text) {
          url.searchParams.set("text", text);
        } else {
          url.searchParams.delete("text");
        }
        try {
          await navigator.clipboard.writeText(url.toString());
          status.textContent = "Link copied!";
        } catch (error) {
          status.textContent = "Copy failed. Use your browser menu.";
        }
        setTimeout(() => {
          status.textContent = "";
        }, 2000);
      }

      window.addEventListener("resize", scheduleDraw);
      window.addEventListener("load", () => {
        resizeCanvas();
        const urlParams = new URLSearchParams(window.location.search);
        const text = urlParams.get("text");
        if (text) {
          document.getElementById("text").value = text;
        }
        scheduleDraw();
      });

      [
        "text",
        "startColor",
        "endColor",
        "maxBubbles",
        "bubblePadding",
        "showCounts",
        "wobbleMode",
        "glassMode",
        "ignoreCase",
        "cleanText",
      ].forEach((id) => {
        const eventName =
          id === "showCounts" ||
          id === "wobbleMode" ||
          id === "glassMode" ||
          id === "ignoreCase" ||
          id === "cleanText"
            ? "change"
            : "input";
        document.getElementById(id).addEventListener(eventName, scheduleDraw);
      });

      document.getElementById("maxBubbles").addEventListener("input", (event) => {
        document.getElementById("maxBubblesValue").textContent = event.target.value;
      });
      document.getElementById("bubblePadding").addEventListener("input", (event) => {
        document.getElementById("bubblePaddingValue").textContent = event.target.value;
      });

      function goBack(link) {
        const text = document.getElementById("text").value;
        if (text) {
          link.href = link.href + "?text=" + encodeURIComponent(text);
        }
        return true;
      }
    </script>
