<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)" />

  <text x="70" y="120" fill="#ffffff" font-family="Arial, sans-serif" font-size="60" font-weight="700">
    Constellation Text Map
  </text>
  <text x="70" y="175" fill="#cbd5f5" font-family="Arial, sans-serif" font-size="26">
    Characters connected like stars
  </text>

  <g opacity="0.7">
    <circle cx="170" cy="260" r="2" fill="#ffffff" />
    <circle cx="250" cy="310" r="1.5" fill="#ffffff" />
    <circle cx="350" cy="260" r="2" fill="#ffffff" />
    <circle cx="420" cy="340" r="1.5" fill="#ffffff" />
    <circle cx="520" cy="290" r="2" fill="#ffffff" />
    <circle cx="610" cy="360" r="1.5" fill="#ffffff" />
    <circle cx="700" cy="300" r="2" fill="#ffffff" />
    <circle cx="790" cy="420" r="1.5" fill="#ffffff" />
    <circle cx="920" cy="340" r="2" fill="#ffffff" />
    <circle cx="1020" cy="380" r="1.5" fill="#ffffff" />
  </g>

  <path
    d="M170 260 Q260 210 350 260 Q440 320 520 290 Q610 240 700 300 Q820 410 920 340 Q980 300 1020 380"
    stroke="#38bdf8"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <g filter="url(#glow)">
    <circle cx="170" cy="260" r="7" fill="#e2e8f0" />
    <circle cx="350" cy="260" r="7" fill="#e2e8f0" />
    <circle cx="520" cy="290" r="7" fill="#e2e8f0" />
    <circle cx="700" cy="300" r="7" fill="#e2e8f0" />
    <circle cx="920" cy="340" r="7" fill="#e2e8f0" />
  </g>
</svg>
